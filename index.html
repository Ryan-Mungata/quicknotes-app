<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DownNote: take and store notes faster, easily and conveniently."
    />
    <title>DownNote</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="brand">
          <h1>DownNote</h1>
          <p>Take and Store notes faster, easily and conveniently.</p>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle">
          Dark
        </button>
      </div>
    </header>
    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="field field-grow">
            <label for="note-input">Your note</label>
            <input
              type="text"
              id="note-input"
              placeholder="What's on your mind?"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="note-category">Category</label>
            <select id="note-category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" role="alert"></p>
      </section>

      <section>
        <h2>Your notes</h2>
        <div class="toolbar">
          <div class="field field-grow">
            <label for="search-input" class="visually-hidden"
              >Search notes</label
            >
            <input
              type="search"
              id="search-input"
              placeholder="Search notes..."
              autocomplete="off"
            />
          </div>
          <button type="button" id="clear-all-btn" class="btn-danger">
            Clear all
          </button>
        </div>
        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 DownNote. All rights reserved</p>
      <p>Developed by Konoha Technologies</p>
    </footer>
  </body>
</html>
